<!--
  Placeholder app icon. NOT a brand mark.

  "TrainLog" is a working name and no logo, wordmark or brand palette exists
  (PRODUCT.md § Brand Commitments). This file exists only because a Web App
  Manifest requires `icons` (PRD §33), and it draws exclusively on tokens
  already declared in src/styles/theme.css — board, card, and three of the five
  semantic hues, in the order the product reads them: Planned, Actual,
  Progression.

  Deliberately free of filters and gradients: it is rasterised by sharp, which
  does not render SVG filter primitives reliably. Depth is omitted rather than
  faked.

  Replace wholesale when real identity work happens. Nothing downstream should
  treat this as settled.
-->
